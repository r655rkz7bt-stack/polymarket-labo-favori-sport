# Mise en page du tableau de bord — libre (décision d'Etienne, 17/10/2026).
# Ce que voit Etienne en premier doit être ce qui compte le plus pour lui (il lit sur iPad / téléphone).
# Aperçu avant publication : scripts/apercu_dashboard.py.

# Ordre des blocs, du haut vers le bas. Identifiants possibles : organisme, resume, principal, aujourdhui, strategie,
# capital, positions, ordres-poses, decisions-recentes, journal, systeme.
# Un bloc absent de la liste garde sa place après les blocs listés.
# 21/10/2026 (demande d'Etienne) : la courbe du capital juste sous le cœur.
ordre: [organisme, capital, resume, strategie, principal, aujourdhui, positions, journal, ordres-poses, decisions-recentes, systeme]

# Blocs cachés (jugés superflus). « resume » et « capital » ne peuvent PAS être cachés (règle n°1 :
# capital, solde disponible et faillite toujours visibles) : le code les réaffiche.
masquer: []

# Blocs REPLIÉS au départ : seul leur titre et une ligne de résumé restent visibles ; un toucher sur
# le titre les ouvre (le navigateur d'Etienne retient son choix). Le cœur, le résumé et le capital
# ne se replient jamais.
replier: [ordres-poses, journal, decisions-recentes, systeme]

# « À la une » : au plus 5 points courts (280 caractères chacun), en tête du résumé : ce qui compte le
# plus pour Etienne en ce moment. Des faits, avec leur source, jamais une promesse de gain. Vide = pas d'encadré.
a_la_une:
  date: "2026-10-29"
  points:
    - "Plus d'arène : nf_sport_patiente_prix_850_875 (favori de sport, prix du vendeur 0,85-0,875, ordre posé) trade directement le capital principal, aux conditions de son ancien fantôme, et reprend la suite de son passé (85 paris du 20 au 28/10, 1 472,59 € à la fin)."

# Courbes de la stratégie : le bouton « Voir ses courbes » charge le journal PUBLIC du capital principal
# (fichier ledger.jsonl de la branche « data ») depuis cette adresse et calcule les courbes dans le navigateur.
# Seule une adresse raw.githubusercontent.com finissant par « / » est acceptée (sinon la page la déduit de
# son adresse GitHub Pages).
journaux_url: "https://raw.githubusercontent.com/r655rkz7bt-stack/polymarket-labo-favori-sport/data/ledger/"
# Antécédents (29/10/2026) : journal du fantôme de la stratégie dans le labo d'origine (branche main, compressé). Une fois
# le capital repris à sa valeur, ses paris et sa courbe précèdent ceux d'ici dans les courbes de la stratégie.
antecedents_url: "https://raw.githubusercontent.com/r655rkz7bt-stack/polymarket-labo-favori-sport/main/archives/labo_origine/nf_sport_patiente_prix_850_875_v1.0.0.jsonl.gz"
