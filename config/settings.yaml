# Réglages généraux du laboratoire dédié à nf_sport_patiente_prix_850_875 (garde-fous : risk_limits.yaml).

# Seul mode existant. Le contrôleur refuse toute autre valeur.
mode: simulation

paths:
  ledger: ledger/ledger.jsonl
  bankruptcy_lock: ledger/BANKRUPT.lock
  database: state/market.sqlite
  logs: logs
  cycle_lock: state/cycle.lock
  # Antécédents (29/10/2026) : journal du fantôme de la stratégie dans le labo d'origine, du 20/10 au 28/10/2026 23 h 42.
  # Relu à chaque cycle (antecedents.py) : la stratégie reprend la suite de son passé (confiance, mise, renfort).
  antecedents: archives/labo_origine/nf_sport_patiente_prix_850_875_v1.0.0.jsonl.gz

cycle:
  # 29/10/2026 : 2 = intervalle entre deux cycles (cron-job.org réglé toutes les 2 min par Etienne). Sert aux identifiants
  # d'opération idempotents (une même décision, relancée dans le même créneau, n'est jamais comptée deux fois) et au
  # rythme d'archivage du scan complet. À garder égal à l'intervalle de cron-job.org.
  bucket_minutes: 2
  reglements_par_lot: 100      # 21/10/2026 : marchés détenus lus par lots de 100 pour les règlements (723 requêtes → ~16)


# Capital principal (29/10/2026 : la stratégie le trade directement, sans arène, AUX CONDITIONS DE SON ANCIEN FANTÔME,
# décision d'Etienne), libre :
principal:
  # Une mise ≤ 25 % du capital estimé (23/10/2026, `fantomes.max_mise` de l'ancien labo) : Kelly sur un biais fixe de
  # +0,05 misait jusqu'à la moitié du capital sur un seul pari.
  max_mise: 0.25
  # Pas de réserve de liquidités : le fantôme n'en avait pas (celle du capital principal de l'ancien labo,
  # `reserve_liquidites: 0.03`, gardait 3 % disponibles). La règle n°1 reste appliquée par ledger.py.

# Santé de la stratégie (sante.py, mêmes réglages que dans l'ancien labo) : mise prudente tant que ses prévisions ne sont
# pas prouvées meilleures que le marché, renfort si elle prouve plus d'avantage qu'elle n'en suppose, suspension si les
# frais mangent tout son avantage. Calculée sur ses antécédents (paths.antecedents) puis sur le journal d'ici.
sante_strategies:
  min_resolved: 20          # prévisions jugées (paris réglés) avant de conclure
  base: 0.5                 # part de la mise habituelle tant que rien n'est prouvé (½ Kelly)
  proven: 1.0               # prouvée meilleure que le prix du marché
  disproven: 0.25           # prouvée moins bonne
  suspension_min_closed: 20 # paris terminés avant de pouvoir suspendre
  renfort: {min_operations: 30, confiance_jour_min: 0.8, paris_fictifs: 30, max: 2.0}

# Deux camps d'un même match (23/10/2026, contrôle `deux_camps`) : pas d'achat au-dessus de `prix_min`
# d'un jeton d'un marché où le portefeuille tient déjà un autre jeton payé au-dessus de ce prix.
deux_camps:
  prix_min: 0.70

# Relecture avant d'acheter (enquête du 20/10/2026) : si le prix de vente a chuté de plus de `chute_max`
# depuis le début du cycle, l'estimation de la stratégie est périmée → pas d'achat ce cycle-ci.
relecture:
  chute_max: 0.03

# Ordres à cours limité posés dans le carnet (mode « patient », limit_ticks). Exécutés seulement si le
# marché passe AU TRAVERS du prix (execution_simulator.py).
limit_orders:
  max_age_hours: 6            # durée de vie maximale d'un ordre posé
  max_open_per_portfolio: 60   # ordres ouverts au plus

http:
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 1.0         # 1 s, 2 s, 4 s...
  min_interval_seconds: 0.2    # politesse envers les API publiques
  user_agent: "polymarket-autonomous-lab/0.1 (paper trading research; no real orders)"

scanner:
  page_size: 100               # maximum accepté par Gamma (vérifié le 14/10/2026)
  max_pages: 15                # jusqu'à 1 500 marchés lus par cycle (décision d'Etienne, 15/10/2026)
  min_horizon_minutes: 30      # horizon : 30 min à 30 jours (élargi le 15/10/2026 : marchés longs inclus)
  max_horizon_hours: 720
  min_liquidity: 1000
  min_volume_24h: 1000
  max_spread: 0.05
  max_favorite_price: 0.99     # au-delà, l'issue est pratiquement connue : rien à gagner
  watchlist_size: 150          # marchés suivis en détail (carnets) à chaque cycle : les plus échangés
  full_snapshot_every_minutes: 30   # archiver tout le scan seulement toutes les 30 min

database:
  max_megabytes: 40

sources:
  # Laboratoire dédié à nf_sport_patiente_prix_850_875 : seules les données publiques de Polymarket (aucune clé).
  polymarket_gamma:
    enabled: true
    base_url: https://gamma-api.polymarket.com
  polymarket_clob:
    enabled: true
    base_url: https://clob.polymarket.com
    books_batch_size: 20

dashboard:
  output_dir: site             # page statique publiée sur GitHub Pages
  every_minutes: 10            # GitHub Pages limite à ~10 publications/heure ; la page se recharge seule
