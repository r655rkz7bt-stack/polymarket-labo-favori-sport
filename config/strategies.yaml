# Laboratoire dédié à UNE stratégie : nf_sport_patiente_prix_850_875, exportée le 28/10/2026 du laboratoire
# « Polymarket Autonomous Lab » (r655rkz7bt-stack/Polymarket-autonomus-lab), où elle était n° 1 de l'arène
# (au 28/10/2026 23 h 48 UTC : 1 484 € fictifs en 8,3 jours, 85 opérations, confiance 90 %, verdict « indéterminée » ;
# la veille 1 566 €, 74 opérations, 98 %, « prometteuse »). Contexte complet : docs/CONTEXTE.md.
#
# 29/10/2026 (décisions d'Etienne) : plus d'arène ni de fantômes. La stratégie trade DIRECTEMENT le capital principal
# (journal signé, règle « à 0 € tu meurs »), aux conditions de son ancien fantôme, en reprenant la suite de son passé
# (config/settings.yaml → principal, sante_strategies, paths.antecedents).
# Pour essayer un autre réglage : changer les valeurs ci-dessous (bornes min/max vérifiées au chargement) et noter
# la date du changement dans docs/CONTEXTE.md, pour savoir à partir de quand les résultats le reflètent.

nf_sport_patiente_prix_850_875:
  explication: "Le favori d'un match (sport ou e-sport), acheté en posant l'ordre 1 cran au-dessus du meilleur acheteur et en attendant un vendeur, seulement quand le prix du vendeur est entre 0,85 et 0,875."
  # Origine : favori naïf (« le favori gagne un peu plus souvent que son prix ») → sport → mode patient → morceau de prix
  # 0,850-0,875 (entonnoir 80/20 du 20/10/2026). Attention : c'était la meilleure de plusieurs dizaines de stratégies de
  # favoris ; une part de son avance peut venir de la chance. Ce laboratoire sert justement à la mettre à l'épreuve.
  class: naive_favorite
  limit_ticks: 1
  filtres: {familles: [sports], prix_min: 0.85, prix_max: 0.875}
  # Ordres posés annulés au coup d'envoi : false = comme dans l'ancien labo (ses 85 positions mesurées). Dans l'ancien labo,
  # les ordres posés servis PENDANT le match perdaient −9,8 % par pari toutes stratégies confondues (sélection adverse) ;
  # pour celle-ci : +2,3 % en match contre +10,2 % avant (docs/CONTEXTE.md). Mettre true pour ne jouer qu'avant le match
  # (ordres posés annulés au coup d'envoi ET aucun nouveau pari une fois le match commencé).
  annuler_au_coup_d_envoi: false
  enabled: true
  version: "1.0.0"
  created_at: "2026-10-20"
  params:
    min_ask:        {value: 0.80, min: 0.50, max: 0.97}
    max_ask:        {value: 0.95, min: 0.60, max: 0.98}
    bias:           {value: 0.05, min: 0.00, max: 0.06}
    uncertainty:    {value: 0.015, min: 0.01, max: 0.10}
    min_net_edge:   {value: 0.01, min: 0.00, max: 0.50}
    max_extra_ticks: {value: 2, min: 0, max: 5}
    max_proposals_per_cycle: {value: 3, min: 0, max: 50}
    # Kelly entier, comme dans l'ancien labo : la santé de la stratégie (config/settings.yaml → sante_strategies) le multiplie
    # ensuite par sa prudence (½ tant que rien n'est prouvé, 1 prouvée, ¼ démentie) et son renfort, comme pour son fantôme.
    kelly_fraction:  {value: 1.0, min: 0.0, max: 5.0}
